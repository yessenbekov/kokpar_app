<style>

<body>
<canvas id="c"></canvas>
<img id="before" src="./art/game-current.png" alt="Текущее поле">
<div id="ui">
<h1>Арена v2 · концепт</h1>
<p>Поле в стиле игры, но с глубиной: горы на горизонте, низкое солнце, вытоптанный грунт со следами копыт, ярусные трибуны под навесом, юрты.</p>
<div class="lbl">Камера</div>
<div class="row" id="cams"><button data-cam="game" class="on">Игровая</button><button data-cam="wide">Обзор</button><button data-cam="low">У забора</button></div>
<div class="lbl">Свет</div>
<div class="row" id="times"><button data-t="gold" class="on">Золотой час</button><button data-t="noon">Полдень</button></div>
<div class="lbl">Ворота</div>
<div class="row" id="goals"><button data-g="ring" class="on">Круг</button><button data-g="kazan">Тайказан</button></div>
<div class="row"><button id="cmp">Показать «было»</button></div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const W = 138, H = 90;
const BLUE = "#176d9f", RED = "#bb3c31", GOLD = "#f0c347";
const fenceX = W / 2 + 14, southZ = -H / 2 - 5.2, northZ = H / 2 + 21;
const rnd = (a, b) => a + Math.random() * (b - a);
let seed = 7; const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const sr = (a, b) => a + srand() * (b - a);

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
window.__dbg = { renderer, scene };
const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 2000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.maxPolarAngle = 1.48; controls.minDistance = 20; controls.maxDistance = 420;

function tex(w, h, draw, repeat) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); }
  return t;
}
function blotches(ctx, w, h, n, colors, rMin, rMax, aMin, aMax) {
  for (let i = 0; i < n; i++) {
    ctx.globalAlpha = sr(aMin, aMax); ctx.fillStyle = colors[i % colors.length];
    ctx.beginPath(); ctx.ellipse(sr(0, w), sr(0, h), sr(rMin, rMax), sr(rMin, rMax) * sr(.4, 1), sr(0, 3.14), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- sky ---------- */
const skyUniforms = { top: { value: new THREE.Color() }, horizon: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3() }, sunCol: { value: new THREE.Color() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(1400, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyUniforms,
  vertexShader: "varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
  fragmentShader: "uniform vec3 top,horizon,sunDir,sunCol;varying vec3 vP;void main(){float h=clamp(vP.y,0.,1.);vec3 c=mix(horizon,top,pow(h,.55));float s=max(dot(vP,normalize(sunDir)),0.);c+=sunCol*(pow(s,600.)*1.2+pow(s,24.)*.18);c=min(c,vec3(1.));if(vP.y<0.)c=horizon;gl_FragColor=vec4(c,1.);}"
}));
sky.name = "sky"; scene.add(sky);

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight("#fce8c0", "#8c9e70", 1.6); scene.add(hemi);
const sun = new THREE.DirectionalLight("#ffd28a", 3.4);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -130, right: 130, top: 110, bottom: -110, near: 10, far: 600 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.35;
scene.add(sun, sun.target);

/* ---------- steppe ---------- */
const grassTex = tex(512, 512, (c, w, h) => {
  c.fillStyle = "#a59c58"; c.fillRect(0, 0, w, h);
  blotches(c, w, h, 900, ["#8f8a48", "#b8ad66", "#9a9a52", "#c2b070"], 3, 26, .15, .4);
  c.strokeStyle = "#7a7a3c"; c.globalAlpha = .35;
  for (let i = 0; i < 1400; i++) { const x = sr(0, w), y = sr(0, h); c.beginPath(); c.moveTo(x, y); c.lineTo(x + sr(-2, 2), y - sr(3, 7)); c.stroke(); }
}, 60);
const steppe = new THREE.Mesh(new THREE.CircleGeometry(900, 64), new THREE.MeshStandardMaterial({ name: "steppe", map: grassTex, roughness: 1 }));
steppe.rotation.x = -Math.PI / 2; steppe.receiveShadow = true; steppe.name = "steppe"; scene.add(steppe);

/* packed-earth apron inside the fence */
const apronW = fenceX * 2 + 6, apronD = northZ - southZ + 6;
const apronTex = tex(1024, Math.round(1024 * apronD / apronW), (c, w, h) => {
  c.fillStyle = "#b98f58"; c.fillRect(0, 0, w, h);
  blotches(c, w, h, 1600, ["#a77d48", "#c9a068", "#9c7444"], 4, 40, .08, .22);
  const g = c.createLinearGradient(0, 0, 0, 12); g.addColorStop(0, "rgba(120,130,60,.7)"); g.addColorStop(1, "rgba(120,130,60,0)");
  c.fillStyle = g; c.fillRect(0, 0, w, 12);
});
const apron = new THREE.Mesh(new THREE.PlaneGeometry(apronW, apronD), new THREE.MeshStandardMaterial({ name: "apron", map: apronTex, roughness: 1 }));
apron.rotation.x = -Math.PI / 2; apron.position.set(0, 0.02, (southZ + northZ) / 2); apron.receiveShadow = true; apron.name = "apron"; scene.add(apron);

/* ---------- playing field ---------- */
const FW = 2048, FH = Math.round(2048 * H / W), S = FW / W;
const px = x => (x + W / 2) * S, pz = z => (z + H / 2) * S;
const GOAL_X = 52;
const fieldTex = tex(FW, FH, (c, w, h) => {
  c.fillStyle = "#d6ab69"; c.fillRect(0, 0, w, h);
  blotches(c, w, h, 5200, ["#c99a58", "#e3bd80", "#bd8d4f", "#d9b47a"], 6, 110, .05, .16);
  // trampled centre & goal areas
  for (const [x, z, r, a] of [[0, 0, 36, .28], [-GOAL_X, 0, 18, .22], [GOAL_X, 0, 18, .22], [0, -14.5, 10, .16]]) {
    const g = c.createRadialGradient(px(x), pz(z), 0, px(x), pz(z), r * S);
    g.addColorStop(0, `rgba(140,92,44,${a})`); g.addColorStop(1, "rgba(140,92,44,0)"); c.fillStyle = g; c.fillRect(0, 0, w, h);
  }
  // team halves
  c.fillStyle = "rgba(23,109,159,.07)"; c.fillRect(0, 0, w / 2, h);
  c.fillStyle = "rgba(187,60,49,.07)"; c.fillRect(w / 2, 0, w / 2, h);
  // hoof tracks
  c.lineCap = "round";
  for (let i = 0; i < 90; i++) {
    c.strokeStyle = srand() > .5 ? "rgba(112,74,36,.22)" : "rgba(240,214,160,.25)";
    c.lineWidth = sr(2, 5); c.setLineDash([sr(2, 5), sr(8, 16)]);
    const x0 = sr(0, w), y0 = sr(0, h);
    c.beginPath(); c.moveTo(x0, y0); c.bezierCurveTo(x0 + sr(-500, 500), y0 + sr(-300, 300), x0 + sr(-500, 500), y0 + sr(-300, 300), x0 + sr(-700, 700), y0 + sr(-400, 400)); c.stroke();
  }
  c.setLineDash([]);
  // ornament (koshkar muiz) inside centre circle
  c.save(); c.translate(px(0), pz(0)); c.strokeStyle = "rgba(122,78,34,.32)"; c.lineWidth = 0.9 * S;
  for (let k = 0; k < 4; k++) {
    c.rotate(Math.PI / 2); c.beginPath(); c.moveTo(0, -1.4 * S);
    c.bezierCurveTo(-1 * S, -4 * S, -4.6 * S, -4.4 * S, -4.4 * S, -2.2 * S);
    c.bezierCurveTo(-4.2 * S, -.6 * S, -2.4 * S, -.8 * S, -2.6 * S, -2 * S); c.stroke();
    c.beginPath(); c.moveTo(0, -1.4 * S);
    c.bezierCurveTo(1 * S, -4 * S, 4.6 * S, -4.4 * S, 4.4 * S, -2.2 * S);
    c.bezierCurveTo(4.2 * S, -.6 * S, 2.4 * S, -.8 * S, 2.6 * S, -2 * S); c.stroke();
  }
  c.restore();
  // chalk lines
  c.strokeStyle = "rgba(250,238,205,.9)"; c.lineWidth = .32 * S;
  const lw = .32 * S / 2;
  c.strokeRect(lw + 6, lw + 6, w - lw * 2 - 12, h - lw * 2 - 12);
  c.beginPath(); c.moveTo(w / 2, 6); c.lineTo(w / 2, h - 6); c.stroke();
  c.beginPath(); c.arc(px(0), pz(0), 8.5 * S, 0, 7); c.stroke();
  c.fillStyle = "rgba(250,238,205,.9)"; c.beginPath(); c.arc(px(0), pz(0), .8 * S, 0, 7); c.fill();
  for (const [x, col] of [[-GOAL_X, BLUE], [GOAL_X, RED]]) {
    c.setLineDash([1.2 * S, .9 * S]); c.strokeStyle = "rgba(250,238,205,.85)";
    c.beginPath(); c.arc(px(x), pz(0), 11 * S, 0, 7); c.stroke(); c.setLineDash([]);
    c.strokeStyle = col; c.globalAlpha = .55; c.lineWidth = .5 * S;
    c.beginPath(); c.arc(px(x), pz(0), 12 * S, 0, 7); c.stroke(); c.globalAlpha = 1; c.lineWidth = .32 * S;
  }
  // serke start mark
  c.strokeStyle = "#4fd7c8"; c.globalAlpha = .9; c.lineWidth = .24 * S;
  c.beginPath(); c.arc(px(0), pz(-14.5), 3.2 * S, 0, 7); c.stroke();
  c.beginPath(); c.moveTo(px(-2.55), pz(-14.5)); c.lineTo(px(2.55), pz(-14.5)); c.moveTo(px(0), pz(-17.05)); c.lineTo(px(0), pz(-11.95)); c.stroke();
  c.globalAlpha = 1;
  // soft edge so field blends into apron
  const e = c.createLinearGradient(0, 0, 0, h);
  e.addColorStop(0, "rgba(150,104,56,.25)"); e.addColorStop(.06, "rgba(150,104,56,0)"); e.addColorStop(.94, "rgba(150,104,56,0)"); e.addColorStop(1, "rgba(150,104,56,.25)");
  c.fillStyle = e; c.fillRect(0, 0, w, h);
});
const field = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshStandardMaterial({ name: "field", map: fieldTex, roughness: .96 }));
field.rotation.x = -Math.PI / 2; field.position.y = 0.04; field.receiveShadow = true; field.name = "field"; scene.add(field);

/* ---------- materials ---------- */
const M = {
  wood: new THREE.MeshStandardMaterial({ name: "wood", color: "#6b4426", roughness: .8 }),
  woodDark: new THREE.MeshStandardMaterial({ name: "woodDark", color: "#3d2819", roughness: .85 }),
  gold: new THREE.MeshStandardMaterial({ name: "gold", color: GOLD, roughness: .35, metalness: .6 }),
  felt: new THREE.MeshStandardMaterial({ name: "felt", color: "#efe4cc", roughness: .95 }),
  stone: new THREE.MeshStandardMaterial({ name: "stone", color: "#e8dcc0", roughness: .9 }),
  standWood: new THREE.MeshStandardMaterial({ name: "standWood", color: "#8a6440", roughness: .9 }),
  blue: new THREE.MeshStandardMaterial({ name: "blue", color: BLUE, roughness: .6 }),
  red: new THREE.MeshStandardMaterial({ name: "red", color: RED, roughness: .6 }),
};

/* ---------- fence ---------- */
const fence = new THREE.Group(); fence.name = "fence";
function rail(x1, z1, x2, z2) {
  const len = Math.hypot(x2 - x1, z2 - z1), ang = Math.atan2(z2 - z1, x2 - x1);
  for (const y of [.62, 1.22]) {
    const r = new THREE.Mesh(new THREE.BoxGeometry(len, .2, .22), M.wood);
    r.position.set((x1 + x2) / 2, y, (z1 + z2) / 2); r.rotation.y = -ang; r.castShadow = true; fence.add(r);
  }
  const n = Math.round(len / 4);
  for (let i = 0; i <= n; i++) {
    const t = i / n, p = new THREE.Mesh(new THREE.CylinderGeometry(.14, .18, 1.6, 7), M.woodDark);
    p.position.set(x1 + (x2 - x1) * t, .8, z1 + (z2 - z1) * t); p.castShadow = true; fence.add(p);
  }
}
rail(-fenceX, southZ, fenceX, southZ); rail(fenceX, southZ, fenceX, northZ); rail(fenceX, northZ, -fenceX, northZ); rail(-fenceX, northZ, -fenceX, southZ);
for (const [x, z] of [[-fenceX, southZ], [fenceX, southZ], [fenceX, northZ], [-fenceX, northZ]]) {
  const p = new THREE.Mesh(new THREE.CylinderGeometry(.32, .38, 3.4, 8), M.woodDark); p.position.set(x, 1.7, z); p.castShadow = true; fence.add(p);
  const cap = new THREE.Mesh(new THREE.OctahedronGeometry(.55), M.gold); cap.position.set(x, 3.75, z); cap.castShadow = true; fence.add(cap);
}
scene.add(fence);

/* ---------- advertising boards around the field ---------- */
function boardTex(segs) {
  return tex(2048, 128, (c, w, h) => {
    const tot = segs.reduce((s, x) => s + x[3], 0); let x = 0;
    for (const [label, bg, fg, flex] of segs) {
      const sw = Math.round(flex / tot * w);
      c.fillStyle = bg; c.fillRect(x, 0, sw, h);
      const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "rgba(255,255,255,.18)"); g.addColorStop(.5, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.28)");
      c.fillStyle = g; c.fillRect(x, 0, sw, h);
      c.fillStyle = fg; c.font = "900 64px Arial"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(label, x + sw / 2, h / 2 + 4);
      if (x) { c.fillStyle = "rgba(255,255,255,.5)"; c.fillRect(x, 0, 3, h); }
      x += sw;
    }
    c.fillStyle = GOLD; c.fillRect(0, 0, w, 5); c.fillRect(0, h - 5, w, 5);
  });
}
const SP = { qt: ["QAZAQ TELECOM", "#1668b8", "#fff", 1.5], bg: ["BAIGE", "#f6f4ee", "#1a1008", 1], tl: ["TULPAR", "#c02020", "#fff8ec", 1], ad: ["ALTYN DALA", "#0f8a4c", "#fff", 1.1], ko: ["KOKPAR.ONLINE", "#1a1005", GOLD, 1.3] };
const boards = new THREE.Group(); boards.name = "adBoards";
for (const b of [
  { segs: [SP.qt, SP.bg, SP.ko, SP.tl, SP.ad], len: W * .94, pos: [0, -H / 2 - 1.6], ry: 0 },
  { segs: [SP.ad, SP.tl, SP.ko, SP.bg, SP.qt], len: W * .94, pos: [0, H / 2 + 1.6], ry: Math.PI },
  { segs: [SP.qt, SP.ko, SP.ad], len: H * .9, pos: [-W / 2 - 1.6, 0], ry: Math.PI / 2 },
  { segs: [SP.tl, SP.ko, SP.bg], len: H * .9, pos: [W / 2 + 1.6, 0], ry: -Math.PI / 2 },
]) {
  const g = new THREE.Group(); g.position.set(b.pos[0], .95, b.pos[1]); g.rotation.y = b.ry;
  const tilt = new THREE.Group(); tilt.rotation.x = -.16; g.add(tilt);
  const back = new THREE.Mesh(new THREE.BoxGeometry(b.len + .2, 1.5, .14), M.woodDark); back.position.z = -.08; back.castShadow = true; tilt.add(back);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(b.len, 1.4), new THREE.MeshStandardMaterial({ map: boardTex(b.segs), roughness: .55, emissive: "#ffffff", emissiveIntensity: .12, emissiveMap: null }));
  face.material.emissiveMap = face.material.map; tilt.add(face);
  boards.add(g);
}
scene.add(boards);

/* ---------- kazan goals ---------- */
function goal(x, mat) {
  const g = new THREE.Group(); g.name = "kazan_" + mat.name;
  const base = new THREE.Mesh(new THREE.CylinderGeometry(6.4, 7, 1.1, 48), M.stone); base.position.y = .55; base.castShadow = base.receiveShadow = true; g.add(base);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(6.45, 6.45, .35, 48, 1, true), mat); band.position.y = .75; g.add(band);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(5.3, .9, 16, 64), mat); ring.rotation.x = Math.PI / 2; ring.position.y = 1.3; ring.castShadow = true; g.add(ring);
  const trim = new THREE.Mesh(new THREE.TorusGeometry(5.3, .16, 8, 64), M.gold); trim.rotation.x = Math.PI / 2; trim.position.y = 2.15; g.add(trim);
  const pit = new THREE.Mesh(new THREE.CircleGeometry(4.5, 48), new THREE.MeshStandardMaterial({ color: "#5a3c20", roughness: 1 })); pit.rotation.x = -Math.PI / 2; pit.position.y = 1.12; g.add(pit);
  for (let i = 0; i < 2; i++) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(.1, .12, 7, 8), M.woodDark); pole.position.set(0, 3.5, (i ? 1 : -1) * 7.6); pole.castShadow = true; g.add(pole);
    const fl = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.3, 8, 1), mat.clone()); fl.material.side = THREE.DoubleSide;
    fl.position.set(Math.sign(x) * 1.3, 6.2, (i ? 1 : -1) * 7.6); fl.castShadow = true; fl.userData.wave = true; g.add(fl);
    const tip = new THREE.Mesh(new THREE.OctahedronGeometry(.3), M.gold); tip.position.set(0, 7.15, (i ? 1 : -1) * 7.6); g.add(tip);
  }
  g.position.set(x, 0, 0); scene.add(g); return g;
}
function ringGoal(x, mat) {
  const g = new THREE.Group(); g.name = "ring_" + mat.name; const R = 8;
  const disc = new THREE.Mesh(new THREE.CircleGeometry(R - .3, 64), new THREE.MeshStandardMaterial({ color: "#ead7a8", roughness: 1 })); disc.rotation.x = -Math.PI / 2; disc.position.y = .06; disc.receiveShadow = true; g.add(disc);
  const inner = new THREE.Mesh(new THREE.RingGeometry(R - 1.6, R - 1.3, 64), new THREE.MeshStandardMaterial({ color: mat.color, roughness: .8, transparent: true, opacity: .45 })); inner.rotation.x = -Math.PI / 2; inner.position.y = .07; g.add(inner);
  const kerb = new THREE.Mesh(new THREE.TorusGeometry(R, .28, 10, 96), mat); kerb.rotation.x = Math.PI / 2; kerb.position.y = .2; kerb.castShadow = true; g.add(kerb);
  const rope = new THREE.Mesh(new THREE.TorusGeometry(R, .06, 6, 96), M.felt); rope.rotation.x = Math.PI / 2; rope.position.y = .85; g.add(rope);
  for (let i = 0; i < 16; i++) {

const crowdCols = ["#26384a", "#7d3029", "#ded1a8", "#2e5f62", "#b9852f", "#5a3a6a", "#e9e0cc", "#176d9f", "#bb3c31", "#3f5f2a"].map(c => new THREE.Color(c));
const skinCols = ["#c99a6e", "#a8774f", "#e0b48a", "#8d6040"].map(c => new THREE.Color(c));
function stand(zEdge, dir) {
  const g = new THREE.Group(); g.name = dir > 0 ? "standNorth" : "standSouth";
  const L = 116, rows = 7, step = 1.15, rise = .62;

  }

  // crowd
  const per = 132, count = per * rows;
  const bodies = new THREE.InstancedMesh(new THREE.BoxGeometry(.55, .8, .4), new THREE.MeshStandardMaterial({ roughness: .95 }), count);
  const heads = new THREE.InstancedMesh(new THREE.SphereGeometry(.2, 8, 6), new THREE.MeshStandardMaterial({ roughness: .9 }), count);
  bodies.name = "crowd"; heads.name = "crowdHeads"; bodies.castShadow = true;
  const m = new THREE.Matrix4(); let k = 0;
  for (let r = 0; r < rows; r++) for (let i = 0; i < per; i++) {

    const x = -L / 2 + 1 + i * (L - 2) / per + sr(-.15, .15), y = rise * (r + 1), z = zEdge + dir * (r * step + step * .55);
    const hh = sr(.9, 1.1);
    m.compose(new THREE.Vector3(x, y + .4 * hh, z), new THREE.Quaternion(), new THREE.Vector3(1, hh, 1)); bodies.setMatrixAt(k, m);
    m.makeTranslation(x, y + .8 * hh + .2, z); heads.setMatrixAt(k, m);
    bodies.setColorAt(k, crowdCols[Math.floor(srand() * crowdCols.length)]); heads.setColorAt(k, skinCols[Math.floor(srand() * skinCols.length)]); k++;
  }
  g.add(bodies, heads);

  const depth = rows * step + 1.4, topY = rise * rows + 5.2;

  roof.rotation.x = -Math.PI / 2 + dir * -.14; roof.position.set(0, topY - .5, zEdge + dir * depth / 2); roof.castShadow = true; g.add(roof);
  const valance = new THREE.Mesh(new THREE.PlaneGeometry(L + 4, .9), new THREE.MeshStandardMaterial({ map: awningTex, roughness: .9, side: THREE.DoubleSide }));
  valance.position.set(0, topY - 1.55 - .1, zEdge - dir * .7); g.add(valance);
  for (let i = 0; i <= 8; i++) {
    const x = -L / 2 - 1 + i * (L + 2) / 8;

      const p = new THREE.Mesh(new THREE.CylinderGeometry(.16, .18, topY, 8), M.woodDark); p.position.set(x, topY / 2, zz); p.castShadow = true; g.add(p);
    }
    if (i % 2 === 0) {
      const fp = new THREE.Mesh(new THREE.CylinderGeometry(.06, .07, 3.4, 6), M.woodDark); fp.position.set(x, topY + 1.2, zEdge + dir * (rows * step + .5)); g.add(fp);

      f.position.set(x + 1.1, topY + 2.3, zEdge + dir * (rows * step + .5)); f.userData.wave = true; g.add(f);

}
const kzFlag = tex(256, 128, (c, w, h) => {

{

for (const [x, z, s, r] of [[-108, -18, 1.1, 1.4], [-112, 4, 1, 1.7], [-104, 22, .9, 1.2], [104, -30, 1, -1.6], [110, -8, 1.15, -1.4], [-60, -86, 1, 0], [-46, -92, .85, .3], [70, -88, 1.05, -.2]]) yurt(x, z, s, r);

/* ---------- mountains ---------- */

{

const riders = [];
function rider(x, z, team, ry) {

  const horseCol = new THREE.MeshStandardMaterial({ color: ["#7a4a26", "#4a2c18", "#a8693a", "#d8d0c0", "#2a1c12"][Math.floor(srand() * 5)], roughness: .7 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(.55, 1.6, 4, 10), horseCol); body.rotation.x = Math.PI / 2; body.position.y = 1.55; g.add(body);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.28, .42, 1.3, 8), horseCol); neck.position.set(0, 2.2, 1.15); neck.rotation.x = .7; g.add(neck);
  const head = new THREE.Mesh(new THREE.BoxGeometry(.38, .4, .95), horseCol); head.position.set(0, 2.6, 1.75); head.rotation.x = .5; g.add(head);

  const tail = new THREE.Mesh(new THREE.CylinderGeometry(.06, .16, 1, 6), M.woodDark); tail.position.set(0, 1.45, -1.45); tail.rotation.x = -.5; g.add(tail);

for (let i = 0; i < dustN; i++) { dustPos[i * 3] = rnd(-80, 80); dustPos[i * 3 + 1] = rnd(.2, 7); dustPos[i * 3 + 2] = rnd(-55, 60); }
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));

/* ---------- time of day ---------- */
const TIMES = {
  gold: { top: "#5f8fc4", horizon: "#e8c08c", sun: "#ffc978", sunI: 3.6, hemiSky: "#ffe2b0", hemiG: "#8c8a5a", hemiI: 1.4, pos: [-150, 70, -70], fog: "#e8c08c", exp: 1.0, mtn: "#9a8aa0" },
  noon: { top: "#3f7fd0", horizon: "#cfe0ec", sun: "#fff4dc", sunI: 3.4, hemiSky: "#e8f0ff", hemiG: "#9a9a62", hemiI: 1.6, pos: [-70, 160, -50], fog: "#d6e0e4", exp: .95, mtn: "#7d8aa8" },
};
function setTime(k) {

  skyUniforms.top.value.set(t.top); skyUniforms.horizon.value.set(t.horizon); skyUniforms.sunCol.value.set(t.sun); skyUniforms.sunDir.value.set(...t.pos).normalize();

}

const CAMS = { game: [[-84, 30, 34], [-38, 0, -6]], wide: [[-150, 120, 190], [0, 0, 0]], low: [[-30, 5, 36], [10, 3, 0]] };

}

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

const waving = []; scene.traverse(o => o.userData.wave && waving.push(o));
waving.forEach(f => f.userData.base = f.geometry.attributes.position.array.slice());
const timer = new THREE.Timer();
renderer.setAnimationLoop(() => {
  timer.update(); const dt = Math.min(timer.getDelta(), .05), t = timer.getElapsed();
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt * 1.4); const e = 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.fromP, camAnim.toP, e); controls.target.lerpVectors(camAnim.fromT, camAnim.toT, e);
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update();
  const p = dust.geometry.attributes.position.array;
  for (let i = 0; i < dustN; i++) { p[i * 3] += dt * (1.2 + Math.sin(i) * .4); p[i * 3 + 1] += Math.sin(t + i) * dt * .15; if (p[i * 3] > 80) p[i * 3] = -80; }
  dust.geometry.attributes.position.needsUpdate = true;
  for (const f of waving) {
    const a = f.geometry.attributes.position, b = f.userData.base;
    for (let i = 0; i < a.count; i++) { const x = b[i * 3]; a.array[i * 3 + 2] = Math.sin(t * 4 + x * 2.2) * .12 * (x + 1.3); }
    a.needsUpdate = true;
  }
  for (const r of riders) r.position.y = Math.abs(Math.sin(t * 5 + r.userData.phase)) * .12;
  renderer.render(scene, camera);
});
