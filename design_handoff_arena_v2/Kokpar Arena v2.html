<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Көкпар — арена v2</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#140c03;font-family:Manrope,system-ui,sans-serif;color:#f2e2b8}
a{color:#f0c347}a:hover{color:#ffe08a}
#c{position:fixed;inset:0;display:block;width:100%;height:100%}
#before{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:2}
#ui{position:fixed;left:16px;top:16px;z-index:3;display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:16px;background:rgba(20,12,3,.82);border:1px solid rgba(240,195,71,.25);backdrop-filter:blur(8px);max-width:300px}
#ui h1{margin:0;font:700 20px/1 Oswald,sans-serif;letter-spacing:.03em;color:#f7ecd0}
#ui p{margin:0;font:400 12px/1.5 Manrope,sans-serif;color:rgba(242,226,184,.72)}
.row{display:flex;flex-wrap:wrap;gap:6px}
.lbl{font:600 10.5px Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:rgba(214,178,110,.7)}
button{font:600 12px Manrope,sans-serif;padding:7px 11px;border-radius:9px;border:1px solid rgba(240,195,71,.28);background:rgba(240,195,71,.08);color:#f2e2b8;cursor:pointer}
button:hover{background:rgba(240,195,71,.18)}
button.on{background:#f0c347;color:#1b0f04;border-color:#f0c347}
</style>
</head>
<body>
<canvas id="c"></canvas>
<img id="before" src="./screenshots/00-current-wrong.png" alt="Текущее поле">
<div id="ui">
<h1>Арена v2 · концепт</h1>
<p>Сцена собрана из модуля code/arenaV2.js — тот же файл кладётся в игру. Размеры, FOV 64 и радиус ворот как в игре.</p>
<div class="lbl">Камера</div>
<div class="row" id="cams"><button data-cam="game" class="on">Игровая</button><button data-cam="wide">Обзор</button><button data-cam="low">У забора</button><button data-cam="goal">Ворота</button></div>
<div class="lbl">Свет</div>
<div class="row" id="times"><button data-t="golden" class="on">Золотой час</button><button data-t="noon">Полдень</button></div>
<div class="lbl">Ворота</div>
<div class="row" id="goals"><button data-g="circle" class="on">Круг</button><button data-g="kazan">Тайказан</button></div>
<div class="row"><button id="cmp">Показать «было»</button></div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { createArenaV2, createRingGoalMeshV2, createKazanGoalMeshV2, GOAL_X } from "./code/arenaV2.js";
import { COLORS } from "./code/constants.js";

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(64, 1, 0.1, 2000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.maxPolarAngle = 1.48; controls.minDistance = 8; controls.maxDistance = 420;

const arena = createArenaV2(scene, renderer, { preset: localStorage.getItem("kokparArenaPreset") || "golden" });

const goals = {
  circle: [createRingGoalMeshV2(COLORS.blue, -1), createRingGoalMeshV2(COLORS.red, 1)],
  kazan: [createKazanGoalMeshV2(COLORS.blue, -1), createKazanGoalMeshV2(COLORS.red, 1)],
};
for (const set of Object.values(goals)) { set[0].position.x = -GOAL_X; set[1].position.x = GOAL_X; scene.add(...set); }
arena.refreshFlags();

// заглушки всадников только для масштаба (в игре — свои модели)
const riders = [];
function rider(x, z, color, ry) {
  const g = new THREE.Group();
  const horse = new THREE.MeshStandardMaterial({ color: ["#7a4a26", "#4a2c18", "#a8693a", "#d8d0c0"][riders.length % 4], roughness: .7 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(1.8, 20, 12), horse); body.scale.set(1.6, .52, .7); body.position.y = 1.2; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.58, 14, 10), horse); head.scale.set(1.15, .78, .85); head.position.set(2.55, 1.45, 0); g.add(head);
  for (const lx of [-1.15, .95]) for (const lz of [-.48, .48]) { const l = new THREE.Mesh(new THREE.CylinderGeometry(.11, .16, 1.25, 8), horse); l.position.set(lx, .45, lz); g.add(l); }
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(.45, .92, 6, 12), new THREE.MeshStandardMaterial({ color, roughness: .58 })); torso.position.set(-.12, 2.3, 0); g.add(torso);
  const hd = new THREE.Mesh(new THREE.SphereGeometry(.32, 12, 10), new THREE.MeshStandardMaterial({ color: "#e4b482" })); hd.position.set(.1, 3.03, 0); g.add(hd);
  g.traverse(o => o.isMesh && (o.castShadow = true));
  g.position.set(x, 0, z); g.rotation.y = ry; g.userData.phase = riders.length; scene.add(g); riders.push(g);
}
for (const [x, z, c, r] of [[-56, 10, COLORS.blue, -.9], [-6, -2, COLORS.blue, .2], [-3, 3, COLORS.blue, -.3], [-10, 5, COLORS.blue, .1], [5, -1, COLORS.red, 3], [8, 3, COLORS.red, 2.8], [12, -4, COLORS.red, 3.3]]) rider(x, z, c, r);

function setGoals(k) {
  for (const [n, set] of Object.entries(goals)) set.forEach(g => g.visible = n === k);
  localStorage.setItem("kokparArenaGoal", k);
  document.querySelectorAll("#goals button").forEach(b => b.classList.toggle("on", b.dataset.g === k));
}
function setPreset(k) {
  arena.setPreset(k); localStorage.setItem("kokparArenaPreset", k);
  document.querySelectorAll("#times button").forEach(b => b.classList.toggle("on", b.dataset.t === k));
}
const CAMS = { game: [[-74, 26, 30], [-44, 0, -2]], wide: [[-150, 120, 190], [0, 0, 0]], low: [[-30, 5, 36], [10, 3, 0]], goal: [[-GOAL_X + 12, 9, 14], [-GOAL_X, 1.5, 0]] };
let camAnim = null;
function setCam(k, instant) {
  const [p, t] = CAMS[k];
  camAnim = { fromP: camera.position.clone(), fromT: controls.target.clone(), toP: new THREE.Vector3(...p), toT: new THREE.Vector3(...t), t: instant ? 1 : 0 };
  localStorage.setItem("kokparArenaCam", k);
  document.querySelectorAll("#cams button").forEach(b => b.classList.toggle("on", b.dataset.cam === k));
}
window.arenaDemo = { setCam, setPreset, setGoals, renderNow: () => { if (camAnim) { camera.position.copy(camAnim.toP); controls.target.copy(camAnim.toT); camAnim = null; } controls.update(); arena.update(0, 0); renderer.render(scene, camera); return canvas.toDataURL("image/jpeg", .9); } };
document.getElementById("cams").onclick = e => e.target.dataset.cam && setCam(e.target.dataset.cam);
document.getElementById("times").onclick = e => e.target.dataset.t && setPreset(e.target.dataset.t);
document.getElementById("goals").onclick = e => e.target.dataset.g && setGoals(e.target.dataset.g);
const before = document.getElementById("before"), cmp = document.getElementById("cmp");
cmp.onclick = () => { const on = before.style.display !== "block"; before.style.display = on ? "block" : "none"; cmp.classList.toggle("on", on); cmp.textContent = on ? "Показать «стало»" : "Показать «было»"; };

setPreset(localStorage.getItem("kokparArenaPreset") || "golden");
setGoals(localStorage.getItem("kokparArenaGoal") || "circle");
setCam(localStorage.getItem("kokparArenaCam") || "game", true);

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

const timer = new THREE.Timer();
renderer.setAnimationLoop(() => {
  timer.update(); const dt = Math.min(timer.getDelta(), .05), t = timer.getElapsed();
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt * 1.4); const e = 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.fromP, camAnim.toP, e); controls.target.lerpVectors(camAnim.fromT, camAnim.toT, e);
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update();
  arena.update(dt, t);
  for (const r of riders) r.position.y = Math.abs(Math.sin(t * 5 + r.userData.phase)) * .12;
  renderer.render(scene, camera);
});
</script>
</body>
</html>
